name: Pull Request CI

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 17
      uses: actions/setup-java@v2
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Copy nachos.conf to root
      run: cp proj1/nachos.conf .

    - name: Compile Nachos OS
      run: javac -d . $(find . -name "*.java")

    - name: Run Nachos OS Self-Tests
      run: java nachos.machine.Machine
